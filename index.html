<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tkbot — WhatsApp Pairing</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: #f5f7fa;
    }
    .card {
      width: min(92vw, 520px);
      padding: 28px;
      border: 1px solid #242a32;
      border-radius: 20px;
      background: #12161c;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #aab3bf; line-height: 1.5; }
    #status { margin: 18px 0; font-weight: 600; }
    #qr {
      display: none;
      width: min(360px, 80vw);
      aspect-ratio: 1;
      margin: 22px auto;
      border-radius: 14px;
      background: white;
      padding: 10px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #303844;
      border-radius: 10px;
      background: #0d1014;
      color: white;
      outline: none;
    }
    button {
      margin-top: 12px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #f1f5f9;
      color: #0b0d10;
      font-weight: 700;
      cursor: pointer;
    }
    code { color: #dce4ee; }
    .small { font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>tkbot WhatsApp Pairing</h1>
    <p>Scan the QR code below with WhatsApp → Linked devices → Link a device.</p>

    <input id="backend" placeholder="Bot backend URL, e.g. https://your-bot-host.example">
    <button id="save">Connect to bot</button>

    <div id="status">Enter your bot backend URL.</div>
    <img id="qr" alt="WhatsApp pairing QR code">
    <p class="small">The QR is generated by the persistent bot process. This page only displays it.</p>
  </main>

  <script>
    const input = document.getElementById('backend');
    const save = document.getElementById('save');
    const status = document.getElementById('status');
    const qr = document.getElementById('qr');

    const params = new URLSearchParams(location.search);
    const initialBackend = params.get('backend') || localStorage.getItem('tkbot-backend') || location.origin;
    input.value = initialBackend;

    function normalize(url) {
      return url.replace(/\/$/, '');
    }

    async function poll() {
      const backend = normalize(input.value.trim());
      if (!backend) return;

      try {
        const response = await fetch(`${backend}/api/pairing-status`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data.connected) {
          qr.style.display = 'none';
          status.textContent = '✅ WhatsApp is connected.';
          return;
        }

        if (data.qr) {
          qr.src = data.qr;
          qr.style.display = 'block';
          status.textContent = '📱 Scan this QR code in WhatsApp.';
        } else {
          qr.style.display = 'none';
          status.textContent = '⏳ Waiting for the bot to generate a QR code…';
        }
      } catch (error) {
        qr.style.display = 'none';
        status.textContent = `⚠️ Could not reach the bot backend: ${error.message}`;
      }
    }

    save.addEventListener('click', () => {
      const backend = normalize(input.value.trim());
      localStorage.setItem('tkbot-backend', backend);
      poll();
    });

    setInterval(poll, 2000);
    poll();
  </script>
</body>
</html>
